name: Render Keep Alive Service

on:
  schedule:
    # Run every 14 minutes to prevent Render free tier from spinning down
    - cron: '*/14 * * * *'
  # Enable manual triggering from the GitHub Actions UI tab
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Render Service
    runs-on: ubuntu-latest

    steps:
      - name: Send HTTP GET Request to Portfolio Website
        run: |
          echo "Sending keep-alive request to Portfolio website on Render..."
          curl -sSf https://my-portfolio-31zr.onrender.com/
          echo ""
          echo "Health check succeeded — Render service is active."
